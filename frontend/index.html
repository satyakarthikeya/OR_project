<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Air Cargo Resource Allocation — OR Decision Support</title>
  <meta name="description" content="Operations Research decision-support system for air-cargo terminal operations: LP workforce and equipment allocation, IP shipment selection." />

  <!-- No build step by design (AGENT.md): React, Tailwind and Plotly come from CDN
       and the .jsx files are compiled in the browser by Babel-standalone. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>

  <script>
    // The theme has to be resolved before first paint, or the page flashes light.
    (function () {
      var stored = localStorage.getItem('acro-theme');
      var dark = stored ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    })();

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // One accent, used only for navigation state, primary actions,
            // focus rings and the leading chart series. Everything else is
            // neutral — restraint is what keeps a hand-rolled UI coherent.
            accent: {
              50: '#eefbf7', 100: '#d5f5ec', 200: '#aeeadb', 300: '#78d8c4',
              400: '#41bda7', 500: '#1fa18d', 600: '#158173', 700: '#14675d',
              800: '#15524b', 900: '#15453f', 950: '#052926',
            },
          },
          fontFamily: {
            sans: ['Inter var', 'Inter', 'ui-sans-serif', 'system-ui',
                   '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue',
                   'Arial', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas',
                   'Liberation Mono', 'monospace'],
          },
          boxShadow: {
            card: '0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.06)',
          },
        },
      },
    };
  </script>

  <style type="text/tailwindcss">
    @layer base {
      html { -webkit-text-size-adjust: 100%; }
      body { @apply bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100; }
      /* Every number in this app is compared against another number, so they
         all get fixed-width digits. */
      .num { font-variant-numeric: tabular-nums; }
      :focus-visible { @apply outline-none ring-2 ring-accent-500 ring-offset-2 ring-offset-slate-50 dark:ring-offset-slate-950; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { @apply rounded-full bg-slate-300 dark:bg-slate-700; }
      ::-webkit-scrollbar-track { @apply bg-transparent; }
    }
    @layer components {
      .skeleton { @apply animate-pulse rounded bg-slate-200 dark:bg-slate-800; }
    }
  </style>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23158173'/><path d='M7 21h4v3H7zM13.5 15h4v9h-4zM20 9h4v15h-4z' fill='white'/></svg>" />
</head>

<body class="h-full">
  <div id="root"></div>

  <noscript>
    <div style="padding:2rem;font-family:system-ui">
      This application requires JavaScript. The API remains usable at
      <a href="/docs">/docs</a>.
    </div>
  </noscript>

  <script>
    // Pin the classic JSX runtime explicitly. Babel 8's react preset defaults to
    // the automatic runtime, which emits `import` statements that a classic
    // <script> cannot execute; naming the runtime keeps the page working
    // whichever Babel version the CDN serves.
    Babel.registerPreset('acro', {
      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
    });
  </script>

  <script src="/api.js"></script>
  <script type="text/babel" data-presets="acro" src="/components.jsx"></script>
  <script type="text/babel" data-presets="acro" src="/page-explorer.jsx"></script>
  <script type="text/babel" data-presets="acro" src="/page-lp-results.jsx"></script>
  <script type="text/babel" data-presets="acro" src="/page-lp.jsx"></script>
  <script type="text/babel" data-presets="acro" src="/app.jsx"></script>
</body>
</html>
